<head>

<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Jersey+10&family=Pirata+One&family=EB+Garamond:wght@400;500;600;700&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* Layout: sticky top bar with views (Cards, Deck Builder, My Decks, Best Decks, Rules, Play); builder is a two-pane pool + deck list that stacks on phones. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#18202B; --muted:#5A6474; --line:#D3D9E1;
  --accent:#0E747B; --accent-ink:#FFFFFF; --legend:#A8720F; --warn:#B4441F; --ok:#2E7D4F;
  --card-paper:#FBFBF8; --card-ink:#1C232E; --card-line:#E1E3E0;
  --display:"Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(20,30,45,.08),0 4px 14px rgba(20,30,45,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C; --surface:#1A2029; --sunk:#151A22; --ink:#E6E9EF; --muted:#9BA4B3; --line:#2B3341;
  --accent:#3BBFC6; --accent-ink:#0B1A1C; --legend:#E2AA3C; --warn:#F07A55; --ok:#5CC48A;
  --card-paper:#1F2630; --card-ink:#E8EAEE; --card-line:#323B48;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1A2029; --sunk:#151A22; --ink:#E6E9EF; --muted:#9BA4B3; --line:#2B3341;
  --accent:#3BBFC6; --accent-ink:#0B1A1C; --legend:#E2AA3C; --warn:#F07A55; --ok:#5CC48A;
  --card-paper:#1F2630; --card-ink:#E8EAEE; --card-line:#323B48;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent)}
.field.col{flex-direction:column;align-items:stretch;gap:4px;color:var(--ink);font-weight:500}
.field.col input{width:100%}
.authf{max-width:420px}
.acct .btn{text-decoration:none;color:var(--ink)}
.acct .btn.primary{color:var(--accent-ink)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--sunk);box-shadow:inset 0 -2px 0 var(--accent)}
.tab-dd{position:relative;display:inline-flex}
.tab-sub{display:none;position:absolute;top:100%;left:0;z-index:40;min-width:160px;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.tab-dd:hover .tab-sub,.tab-dd:focus-within .tab-sub{display:flex}
.tab-sub a{white-space:nowrap}
.subtabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.subtabs a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
.subtabs a[aria-current="page"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.rules.quick{max-width:780px}
.party-h{margin:4px 0 2px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bhead h1{margin-bottom:0}
.btn.newdeck{font-weight:700;text-decoration:none}
.newdeck-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rb-list{margin:8px 0 10px 18px;padding:0;max-height:220px;overflow:auto}
.rb-list li{margin:3px 0}
.discord-btn{flex:none;text-decoration:none;color:var(--ink)}
@media (max-width:1279px){.discord-btn{margin-left:auto}}
.acct{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.acct img{width:26px;height:26px;border-radius:50%}
.skin-btn{flex:none;width:auto;padding:4px 8px;font-size:.85rem;cursor:pointer}
/* floating bottom bar while browsing (Changelog left, theme right); gone while a game is open */
body{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
.sitebar{position:fixed;left:0;right:0;bottom:0;z-index:19;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.sitebar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px}
.sitebar .sb-link{font-weight:600;text-decoration:none;color:var(--ink);padding:5px 10px;border-radius:8px}
.sitebar .sb-link:hover,.sitebar .sb-link[aria-current="page"]{background:var(--sunk);color:var(--accent,var(--ink))}
html:has(#play-root .pl-game) .sitebar{display:none}
html:has(#play-root .pl-game) body{padding-bottom:0}
html:not(:has(#play-root .pl-game)) .toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
html[data-skin="retro"] .sitebar{background:var(--win);border-top:3px solid var(--frame);box-shadow:0 -2px 0 var(--frame-dark),0 -6px 0 rgba(0,0,0,.25)}
html[data-skin="retro"] .sitebar .sb-link{font-family:var(--display);font-weight:400;font-size:1.04rem;letter-spacing:.03em;color:#fff;text-shadow:1px 1px 0 #000}
html[data-skin="retro"] .sitebar .sb-link:hover,html[data-skin="retro"] .sitebar .sb-link[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--accent)}
html[data-skin="art"] .sitebar{background:linear-gradient(180deg,rgba(80,46,34,.98),rgba(52,28,22,.98));border-top:2px solid #b8743a;box-shadow:0 -4px 12px rgba(0,0,0,.4)}
html[data-skin="art"] .sitebar .sb-link{font-family:"Pirata One",var(--display);font-weight:400;font-size:1.1rem;color:#f3e6cf}
html[data-skin="art"] .sitebar .sb-link:hover,html[data-skin="art"] .sitebar .sb-link[aria-current="page"]{background:rgba(255,255,255,.08);color:#ffc100}
/* Card Art theme: cards with finished art show the card image (upgraded equipment shows its back side) */
html[data-skin="art"] .grid:not(.hand-grid){grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:720px){html[data-skin="art"] .grid:not(.hand-grid){grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}}
.card.art{background:radial-gradient(120% 70% at 50% 32%,color-mix(in srgb,var(--cc) 55%,#3a3a44),#121218 78%);border:0;border-radius:5%/3.6%;align-self:start}
.card.art .c-art{display:block;width:100%;height:auto;aspect-ratio:5/7}
/* Card Image Template: rules text and numbers drawn over the blank card export (sizes are export px / 751 overlay width) */
.card.art .art-frame{position:relative;width:100%;container-type:inline-size}
.art-ov{position:absolute;inset:0;pointer-events:none;font-family:"Pirata One",var(--display);color:#fff}
.ov-line{position:absolute;transform:translateY(-50%);text-align:center;white-space:nowrap;line-height:1;font-size:6.658cqw;color:#fff5de;text-shadow:0 .4cqw .25cqw rgba(0,0,0,.85)}
.ov-fit{display:inline-block}
.ov-line.ov-upgrade{font-size:3.995cqw;color:#ffc100}
.ov-upgrade .coin{display:inline-block;width:.78em;height:.78em;margin-left:.3em;vertical-align:-.08em;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22 shape-rendering=%22crispEdges%22%3E%3Crect x=%222%22 y=%220%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%223%22 y=%220%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%224%22 y=%220%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%225%22 y=%220%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%226%22 y=%220%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%227%22 y=%220%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%221%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%222%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%223%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%224%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%225%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%226%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%227%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%228%22 y=%221%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%220%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%233a2206%22/%3E%3Crect x=%221%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%222%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23fff4b8%22/%3E%3Crect x=%223%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23fff4b8%22/%3E%3Crect x=%224%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%225%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%226%22 y=%222%22 width=%221%22 height=%221%22 fill=%22%23ffc93c%22/%3E%3Crect x=%227%22 y=%222%22 width=%221%22 height=%221%22 .ov-rules{position:absolute;overflow:hidden;font-size:4.128cqw;line-height:1.1;letter-spacing:.015em;text-align:left;text-shadow:0 .4cqw .25cqw rgba(0,0,0,.85)}
.ov-rules p{margin:0 0 .53cqw}
.ov-rules .aura{width:.7em;height:.85em}
.ov-rules .rem{font-style:italic;font-size:.9em;color:#e9dfcb}
.c-rules .rem{font-style:italic;font-size:.92em;color:var(--muted)}
/* stat words in card text take their icon colours (darker on the light Clean theme, bright on dark cards) */
.kw{font-weight:inherit}
.kw-str{color:#c4161c}.kw-def{color:#2b8a2b}.kw-hp{color:#5b4fa8}.kw-aura{color:#137aa8}
html[data-skin="retro"] .kw-str,html[data-skin="art"] .kw-str,.ov-rules .kw-str{color:#ff5a5a}
html[data-skin="retro"] .kw-def,html[data-skin="art"] .kw-def,.ov-rules .kw-def{color:#7be04f}
html[data-skin="retro"] .kw-hp,html[data-skin="art"] .kw-hp,.ov-rules .kw-hp{color:#b3a6f2}
html[data-skin="retro"] .kw-aura,html[data-skin="art"] .kw-aura,.ov-rules .kw-aura{color:#55e3ee}
/* Play tab: point at one of your Heroes to light up the hand cards it can play */
.pl-hand.for-hero .hc:not(.fits){opacity:.35;filter:grayscale(.7)}
.pl-hand.for-hero .hc.fits .card{outline:3px solid #5fc8ff;outline-offset:1px}
.pl-hand .hc{transition:opacity .15s,filter .15s}
.ov-rules .lvl{display:inline-block;height:1.15em;width:auto;vertical-align:-.3em;margin-right:.2em;image-rendering:pixelated}
.ov-num{position:absolute;transform:translate(-50%,-50%);font-size:7.323cqw;line-height:1;font-weight:400;color:#ffc100;-webkit-text-stroke:1.332cqw #000;paint-order:stroke fill;text-shadow:0 .4cqw .25cqw rgba(0,0,0,.85);white-space:nowrap}
.card.art .flip{position:absolute;top:17%;right:7%;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(15,18,26,.72);color:#fff;font-size:17px;line-height:1;cursor:pointer;z-index:2}
.card.art .flip:hover,.card.art .flip:focus-visible{border-color:#D9A53A;color:#FFD27A;outline:none}
.card.art .slotbadge{top:17%}
.card.art .c-ctrl{border-top:0}
button.card.art:hover,.card.art[role="button"]:hover{box-shadow:0 0 0 2px var(--cc),var(--shadow)}
.card.art[role="button"]{cursor:pointer}.card.art[role="button"]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.art.upside{box-shadow:0 0 0 3px #D9A53A,var(--shadow)}
.modal .card.art{max-width:min(600px,calc((90vh - 150px)*5/7));width:100%;margin-inline:auto}
.art-rate{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted,#8a8f99);margin-top:-4px}
.art-rate[hidden]{display:none}
.art-rate .ar-l{font-weight:600;letter-spacing:.02em}
.art-rate .ar-b{display:inline-grid;place-items:center;width:32px;height:28px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;padding:0;opacity:.8}
.art-rate .ar-b:hover,.art-rate .ar-b:focus-visible{opacity:1;outline:none;box-shadow:0 0 0 2px rgba(217,165,58,.55)}
.art-rate .ar-down svg{transform:scaleY(-1)}
.art-rate .ar-up[aria-pressed="true"]{background:#2E8B57;border-color:#2E8B57;color:#fff;opacity:1}
.art-rate .ar-down[aria-pressed="true"]{background:#B23A3A;border-color:#B23A3A;color:#fff;opacity:1}
.art-rate .ar-s b{color:var(--ink,inherit)}
.art-rate .ar-n{opacity:.75}
.zoom{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;cursor:zoom-in;flex:none;line-height:1}
.c-foot .zoom{margin-left:auto;width:24px;height:24px;border:1px solid var(--card-line);background:var(--card-paper);color:var(--card-ink)}
.c-foot .flip+.zoom{margin-left:0}
.c-foot:has(.zoom) .stats{width:auto;flex:1}
.c-foot .zoom:hover,.c-foot .zoom:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.card.art>.zoom{position:absolute;top:17%;left:7%;border:1px solid rgba(255,255,255,.7);background:rgba(15,18,26,.72);color:#fff;z-index:2}
.card.art>.zoom:hover,.card.art>.zoom:focus-visible{border-color:#D9A53A;color:#FFD27A;outline:none}
/* magnifier and flip icons sit at 50% opacity so they don't cover the art; full on hover/focus */
.card .flip,.card .zoom,.ph-face>.zoom{opacity:.5;transition:opacity .15s}
.card .flip:hover,.card .flip:focus-visible,.card .zoom:hover,.card .zoom:focus-visible,.ph-face>.zoom:hover,.ph-face>.zoom:focus-visible{opacity:1}
.card[data-pool]{cursor:pointer;user-select:none}
.card[data-pool]:hover{border-color:var(--cc)}
.card.art[data-pool]:hover{box-shadow:0 0 0 2px var(--cc),var(--shadow)}
html[data-skin="retro"] select.skin-btn{font-family:var(--display);font-size:1rem;letter-spacing:.03em;padding:2px 8px}
@media (max-width:720px){.top .brand{order:-2}.skin-btn{padding:3px 8px;font-size:.75rem}}
.acct b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main .wrap{padding-block:22px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.9rem}
h2{font-size:1.35rem}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.field{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
select,input[type=search],input[type=text],input[type=email],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{min-width:0;width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

/* card tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.group-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.group-h:first-child{margin-top:0}
.group-h .dot{width:12px;height:12px;border-radius:3px;background:var(--cc);transform:rotate(45deg)}
.group-h span{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:400}
.card{position:relative;display:flex;flex-direction:column;background:var(--card-paper);color:var(--card-ink);border:1px solid var(--card-line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;min-width:0}
button.card{cursor:pointer}
/* Deck Builder: a card at its copy limit is faded and can't be added again (the − button stays usable) */
.card.maxed>:not(.c-ctrl){opacity:.38;filter:grayscale(.5)}
.card.maxed{border-style:dashed}
.maxtag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-left:2px}
/* Tokens: lighter tint so they don't read as playable cards */
.card.token{background:color-mix(in srgb,var(--card-paper) 82%,#7fb6ff)}
button.card:hover{border-color:var(--cc)}
.c-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--cc);color:var(--ct);min-height:46px}
.c-name{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.15;flex:1;min-width:0}
.gem{flex:none;width:32px;height:36px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card-paper);color:var(--card-ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:1rem}
.c-type{padding:6px 12px 0;font-size:.8rem;color:var(--muted);letter-spacing:.02em;display:flex;gap:6px;justify-content:space-between}
.c-type .leg{color:var(--legend);font-weight:700}
.c-rules{padding:6px 12px 10px;font-size:.9rem;line-height:1.38;flex:1}
.c-rules p{margin:0 0 4px}
.lv{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--surface);vertical-align:1px}
.aura{display:inline-block;width:.72em;height:.9em;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);vertical-align:-1px;margin-left:1px}
.c-foot .flip{margin-left:auto;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--card-line);background:var(--card-paper);color:var(--card-ink);font-size:15px;line-height:1;cursor:pointer;flex:none}
.c-foot .flip:hover,.c-foot .flip:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.card.upside{box-shadow:0 0 0 2px #D9A53A,var(--shadow)}
.card.upside .c-rules{background:linear-gradient(180deg,rgba(217,165,58,.10),transparent 70%)}
.upstar{color:#FFD45C;text-shadow:0 0 2px #000}
.upcost{color:#9A6B00}
.cver{font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.03em;color:var(--muted);border:1px solid var(--card-line);border-radius:4px;padding:0 4px;margin-left:4px}
.c-foot{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--card-line);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.stats{display:flex;gap:4px;width:100%}
.stat{flex:1;text-align:center;border:1px solid var(--card-line);border-radius:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:1rem;color:var(--card-ink)}
.stat i{font-style:normal;font-size:.68rem;letter-spacing:.08em}
.c-ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--card-line);background:var(--sunk)}
.c-ctrl .q{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:center}
.c-ctrl .btn{padding:2px 10px}
.c-ctrl .sp{flex:1}
.card.picked{outline:3px solid var(--accent);outline-offset:-1px}
.card .slotbadge{position:absolute;top:52px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}

/* builder */
.steps{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:.8rem}
.step.on{color:var(--ink)} .step.on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done b{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps .sep{width:28px;height:1px;background:var(--line)}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:74px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.slot.full{border-style:solid;border-color:var(--cc)}
.slot small{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.slot .nm{font-family:var(--display);font-weight:700;font-size:1.05rem}
.slot .cl{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.slot .cl .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.slot.hero-full{padding:0;border:0;background:none;min-height:0}
.slot.hero-full .card{height:100%}
.slot.hero-full .slotbadge{top:12px;background:rgba(255,255,255,.92);color:#18202B}
/* Deck Builder party: digital Hero Cards (same look as the Play tab) */
.slot.hero-dig{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot.hero-dig .c-ctrl{width:100%;max-width:300px;display:flex;gap:6px;align-items:center}
.slot.hero-dig .c-ctrl .sp{flex:1}
.dh-card{position:relative;width:100%;max-width:300px;container-type:inline-size;background:#120c08;border:2px solid #b8743a;border-radius:7px;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dh-slot{position:absolute;left:50%;top:0;transform:translate(-50%,-55%);z-index:3;padding:1px 9px;border-radius:999px;background:#120c08;border:1px solid #b8743a;color:#ffc100;font:700 max(10px,4.2cqw)/1.3 "EB Garamond",Georgia,serif;letter-spacing:.08em;white-space:nowrap}
.dh-nb{display:flex;align-items:center;gap:2.5cqw;height:13.5cqw;padding:0 2.5cqw;background:linear-gradient(#0000,#0006),var(--cc);border-bottom:2px solid #b8743a;border-radius:5px 5px 0 0}
.dh-ci{height:76%;width:auto;flex:none;filter:drop-shadow(0 1px 0 #000);image-rendering:pixelated}
.dh-nm{flex:1;min-width:0;font:400 9.4cqw/1 "Pirata One",var(--display);color:#fff;text-shadow:0 .8cqw 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.dh-nm.l{font-size:8.2cqw}.dh-nm.xl{font-size:7.2cqw}
.dh-au{flex:none;min-width:9.5cqw;height:9.5cqw;padding:0 1cqw;border-radius:50%;border:1px solid #cfe9ff;background:radial-gradient(circle at 35% 30%,#bfe6ff,#2f86e0 55%,#123e8c);color:#fff;font:400 6.6cqw/1 "Pirata One",var(--display);text-shadow:0 1px 0 #000;display:grid;place-items:center}
.dh-art{position:relative;line-height:0;overflow:hidden;background:#000}
.dh-art>img{display:block;width:100%;height:auto;aspect-ratio:207/167;image-rendering:pixelated}
.dh-art>.zoom{position:absolute;top:4%;left:3%;width:24px;height:24px;border:1px solid rgba(255,255,255,.7);background:rgba(15,18,26,.72);color:#fff;z-index:3;line-height:1;display:grid;place-items:center;border-radius:4px;cursor:zoom-in}
.dh-st{display:grid;grid-template-columns:1fr 1fr 1fr 1.45fr;border-top:2px solid #b8743a;height:19cqw}
.dh-sq{border-right:1px solid #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;min-width:0}
.dh-sq:first-child{border-radius:0 0 0 5px}
.dh-str{background:linear-gradient(#ffffff22,#0000 50%,#0003),#b3121a}
.dh-hp{background:linear-gradient(#ffffff22,#0000 50%,#0003),#7f7fd8}
.dh-def{background:linear-gradient(#ffffff22,#0000 50%,#0003),#3f9b3f}
.dh-sq b{font:400 12.5cqw/.9 "Pirata One",var(--display);color:#ffc100;-webkit-text-stroke:.9cqw #000;paint-order:stroke fill;text-shadow:0 .7cqw 0 #000}
.dh-sq i{font:700 max(8px,4.3cqw)/1.1 "EB Garamond",Georgia,serif;font-style:normal;letter-spacing:.06em;color:#fff;text-shadow:0 1px 0 #000;white-space:nowrap}
.dh-ab{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(#3a2a1c,#22180f);font:700 max(9px,6.6cqw) "EB Garamond",Georgia,serif;color:#e2a865;cursor:help;border-radius:0 0 5px 0;letter-spacing:.03em}
.dh-ab:hover,.dh-ab:focus{background:linear-gradient(#5a3f22,#33231a);color:#ffd98a;outline:none}
.dh-tip{display:none;position:absolute;top:calc(100% + 6px);right:-2px;width:100cqw;min-width:220px;padding:8px 10px;background:rgba(36,24,15,.97);border:2px solid #b8743a;border-radius:8px;box-shadow:0 6px 18px #000c;font:500 14px/1.35 "EB Garamond",Georgia,serif;color:#f3e6cf;letter-spacing:0;text-align:left;z-index:40;cursor:default;white-space:normal}
.dh-ab:hover .dh-tip,.dh-ab:focus .dh-tip{display:block}
.dh-tip p{margin:4px 0 0}.dh-tip img{height:1.1em;width:auto;vertical-align:-2px}
.dh-tt{display:block;font:400 18px/1.1 "Pirata One",var(--display);color:#ffc100}.dh-tt small{font:500 12px "EB Garamond",serif;color:#bfa888;margin-left:4px}
.party:has(.hero-dig){margin-top:22px}
/* Deck module top row: count on the left, Save on the right */
.dp-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dp-top .dp-save{flex:none}
.dl li .nlink{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.dl li .nlink:hover{color:var(--accent);text-decoration:underline}
.dl li .nlink.bad{color:var(--warn)}
.deck.best .best-h{display:flex;align-items:center;gap:10px}
.deck.best .best-h h3{flex:1;min-width:0}
.deck.best .rank{font-family:var(--display);font-weight:800;color:var(--muted)}
.deck.best .pct{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--ok);font-variant-numeric:tabular-nums}
.deck.best .best-rec{font-size:.9rem;font-variant-numeric:tabular-nums}
.deck.best .pill{cursor:pointer}
.dl-faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dl-face{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0;border-radius:8px;padding:2px}
.dl-face:focus-visible{outline:2px solid var(--cc);outline-offset:2px}
.dl-av{display:block;width:100%;max-width:84px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:3px solid var(--cc);background:var(--sunk);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.dl-av img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.55);transform-origin:50% 22%;image-rendering:pixelated}
.dl-face:hover .dl-av{filter:brightness(1.12)}
.dl-fn{display:block;font-size:.78rem;line-height:1.2;text-align:center;max-width:100%;overflow-wrap:break-word}
.dl-ci{width:16px;height:16px;vertical-align:-3px;margin-right:4px;image-rendering:pixelated}
.dl-tabs{display:flex;gap:6px;margin:4px 0 12px}.dl-tabs a{text-decoration:none}.dl-tabs .btn.on{background:var(--accent);color:var(--accent-ink,#fff);border-color:var(--accent)}
.deck.comm .tag-mine{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok)}
.bar a.btn{text-decoration:none;color:var(--ink)}
.slot .x{align-self:flex-start;border:0;background:none;color:var(--muted);padding:0;font-size:.8rem;text-decoration:underline}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start;margin-top:8px}
.deckpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 90px);overflow:auto}
.deckpanel input[type=text]{width:100%;font-family:var(--display);font-size:1.15rem;font-weight:700}
.meter{display:flex;align-items:baseline;gap:8px}
.meter .big{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.meter .of{color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.over i{background:var(--warn)}
.curve{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;height:70px}
.curve div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.curve span.b{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.curve-l{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dl h4{margin:8px 0 2px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.dl ul{list-style:none;margin:0;padding:0}
.dl li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.dl li .q{font-weight:700;width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.dl li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl li .n.bad{color:var(--warn)}
.dl li .dot{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.dl li .cst{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.dl li .leg-ico{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#E0A526;color:#2B1D00;font-weight:900;font-size:.68rem;line-height:1;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#hovercard{position:fixed;z-index:2000;width:min(390px,92vw,calc((100vh - 16px)*5/7));pointer-events:none;display:none;filter:drop-shadow(0 8px 22px rgba(0,0,0,.45))}
#hovercard>*{width:100%;margin:0}
.mini{border:1px solid var(--line);background:none;border-radius:5px;width:22px;height:22px;padding:0;line-height:1;font-size:.95rem}
/* update 30: remove-all ×, Visual View, Deck log */
.mini.rmall{color:#d23b3b;border-color:transparent;font-weight:800;font-size:1.05rem;margin-left:2px}
.mini.rmall:hover{background:rgba(210,59,59,.14);border-color:#d23b3b}
.vis-box{max-width:1240px}
.vis-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vis-top h2{margin:0}
.vs-heroes{display:flex;gap:14px;flex-wrap:wrap}
.vs-hero{width:170px;display:flex;flex-direction:column;gap:4px}
.vs-pos{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vs-g h3{margin:6px 0 8px;font-size:1.05rem}.vs-g h3 span{color:var(--muted);font-weight:600}
.vs-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.vs-stack{--w:150px;--step:30px;position:relative;width:var(--w);height:calc(var(--w)*1.4 + (var(--n) - 1)*var(--step))}
.vs-card{position:absolute;left:0;top:calc(var(--i)*var(--step));width:var(--w)}
.vs-card .card{width:100%;min-height:calc(var(--w)*1.4);font-size:.62rem;box-shadow:0 2px 6px rgba(0,0,0,.35)}
html:not([data-skin="art"]) .vs-stack{--w:170px;--step:54px}
html:not([data-skin="art"]) .vs-card .card{height:calc(var(--w)*1.4);overflow:hidden}
.vs-q{position:absolute;right:6px;bottom:6px;background:rgba(10,14,20,.85);color:#fff;font-weight:800;font-size:.8rem;padding:2px 7px;border-radius:7px;z-index:5}
.vs-hero .card{font-size:.62rem}
.deck-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.deck-log li{border-bottom:1px solid var(--line);padding-bottom:8px;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.deck-log time{font-size:.78rem;color:var(--muted);font-weight:600}
.lg-add{color:#3f9a4f}.lg-rem{color:#d23b3b}
@media (max-width:560px){.vs-stack{--w:120px;--step:24px}.vs-hero{width:130px}}
.issues{margin:0;padding:10px 12px;border-radius:10px;font-size:.88rem;list-style:none;display:flex;flex-direction:column;gap:3px}
.issues.bad{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink)}
.issues.bad li::before{content:"✕ ";color:var(--warn);font-weight:700}
.issues.good{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.issues.good li::before{content:"✓ ";color:var(--ok);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.82rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;grid-column:1/-1}

/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.deck h3{font-size:1.15rem}
.deck .pips{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--sunk);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.status{font-size:.82rem;font-weight:700}
.status.ok{color:var(--ok)} .status.no{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.panel textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .card{box-shadow:none}
.modal .c-rules{font-size:1rem}
/* a selected card opens 1.5x its usual view size */
.modal .box:has(> .card){max-width:630px}
.modal .box:has(> .card)>.card:not(.art){width:min(384px,calc((100vw - 90px)/1.5));zoom:1.5;align-self:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-size:.92rem;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.busy{position:fixed;inset:0;z-index:55;background:rgba(10,14,20,.45);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.3rem}

/* test hand */
.modal .box.wide{max-width:980px}
/* zoom arrows: step through the list the zoomed card came from (Clean: chevrons; Retro/Card Art: the menu hand pointer) */
.modal .znav{position:fixed;top:50%;z-index:3;width:50px;height:68px;padding:0;justify-content:center;transform:translateY(-50%);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.modal .znav.prev{left:max(8px,calc(50% - 315px - 64px))}
.modal .znav.next{right:max(8px,calc(50% - 315px - 64px))}
.modal .znav.prev .zchev{transform:scaleX(-1)}
.modal .znav:disabled{visibility:hidden}
.modal .zcount{align-self:center;margin-right:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.92rem}
html:is([data-skin="retro"],[data-skin="art"]) .modal .znav .zchev{display:none}
html:is([data-skin="retro"],[data-skin="art"]) .modal .znav::before{content:"";flex:none;width:38px;height:21px;background:var(--hand) center/contain no-repeat;filter:drop-shadow(1px 1px 0 #000)}
html:is([data-skin="retro"],[data-skin="art"]) .modal .znav.prev::before{transform:scaleX(-1)}
html:is([data-skin="retro"],[data-skin="art"]) .modal .znav:hover:not(:disabled)::before{animation:znav-nudge .5s steps(2) infinite}
@keyframes znav-nudge{50%{translate:3px 0}}
html:is([data-skin="retro"],[data-skin="art"]) .modal .znav.prev:hover:not(:disabled)::before{animation-name:znav-nudge-l}
@keyframes znav-nudge-l{50%{translate:-3px 0}}
@media (max-width:760px){.modal .znav{width:40px;height:56px;opacity:.9}.modal.has-znav{padding-inline:52px}}
@media (max-width:480px){.modal.has-znav{padding-inline:42px}.modal .znav{width:34px;height:50px}.modal .znav::before{width:28px!important}}
.handbtn{justify-content:center}
.btn.primary.go{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn.primary.go:hover:not(:disabled){filter:brightness(1.08)}
.hstats{display:flex;gap:4px;margin:6px 0 4px}
.hstats>span{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:1px 0;background:var(--sunk);font-variant-numeric:tabular-nums;line-height:1.15}
.hstats b{display:block;font-size:.95rem}
.hstats i{display:block;font-style:normal;font-size:.62rem;letter-spacing:.08em;color:var(--muted)}
.hstats.sm{margin:0;gap:3px;flex:none}
.hstats.sm>span{flex:none;min-width:30px;padding:0 3px}
.hstats.sm b{font-size:.82rem}
.hstats.sm i{font-size:.55rem}
.btn.primary.handbtn{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn.primary.handbtn:hover{filter:brightness(1.08)}
.hand-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hand-t{min-width:0;flex:1 1 220px}
.hand-r{display:flex;align-items:flex-start;gap:10px;margin-left:auto}
.aura-box{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 12px;border:1.5px solid var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.aura-gem{width:30px;height:38px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none}
.aura-box b{display:block;font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.aura-box small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px}
.aura-src{display:block;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hand-stats{display:flex;flex-wrap:wrap;gap:6px}
.hand-stats b{font-variant-numeric:tabular-nums}
.hand-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.hand-grid .slotbadge{top:auto;bottom:9px;right:10px}
.note.warn{color:var(--warn)}
@media (max-width:560px){.hand-r{width:100%;margin-left:0}.hand-r .aura-box{flex:1}.grid.hand-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hand-grid .c-rules{font-size:.82rem}.modal .box.wide{padding:14px}}

/* rules */
.rules-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
.rtoc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.rtoc-list{display:flex;flex-direction:column;gap:1px}
.rtoc-list button{text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:.9rem}
.rtoc-list button:hover{background:var(--sunk);color:var(--ink)}
.rtoc-sel{display:none;width:100%}
.rules{max-width:78ch;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 32px 32px}
.rules h2{font-size:1.45rem;margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.rules .rsec:first-child h2{border-top:0;padding-top:8px}
.rules h3{font-size:1.12rem;margin:22px 0 6px}
.rules p,.rules li{line-height:1.6}
.rules p{margin:8px 0}
.rules ul,.rules ol{padding-left:1.4em;margin:8px 0}
.rules li{margin:3px 0}
.rules em{color:var(--muted)}
.rsec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.tblwrap{overflow-x:auto;margin:12px 0}
.rules table{border-collapse:collapse;width:100%;font-size:.93rem}
.rules th,.rules td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.rules th{background:var(--sunk);font-weight:700}
@media (max-width:900px){
  .rules-wrap{grid-template-columns:minmax(0,1fr)}
  .rtoc{position:static;max-height:none}
  .rtoc-list{display:none}
  .rtoc-sel{display:block}
  .rules{padding:4px 16px 22px}
}

@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)}
  .deckpanel{position:static;max-height:none;order:-1}
}
@media (max-width:560px){
  .party{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  input[type=search]{width:100%}
  .acct{margin-left:0;width:100%}
  h1{font-size:1.55rem}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s, transform .15s} button.card:hover,.card.art[role="button"]:hover{transform:translateY(-2px)}}

.sb-links{display:flex;align-items:center;gap:4px}
