<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crystal Quest Deck Forge</title>
<meta name="description" content="Browse every Crystal Quest card, build decks, save them to your account, export print-and-play PDFs or Tabletop Simulator decks, and play games against the AI or friends online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/* theme: "retro" (default) or "clean"; set before CSS paints */(function(){var k="retro";try{k=localStorage.getItem("cq.skin")||"retro"}catch(e){}document.documentElement.dataset.skin=k==="clean"?"clean":"retro"})()</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Jersey+10&family=Pixelify+Sans:wght@400;700&display=swap">
<style>
/* Layout: sticky top bar with views (Cards, Deck Builder, My Decks, Best Decks, Rules, Play); builder is a two-pane pool + deck list that stacks on phones. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#18202B; --muted:#5A6474; --line:#D3D9E1;
  --accent:#0E747B; --accent-ink:#FFFFFF; --legend:#A8720F; --warn:#B4441F; --ok:#2E7D4F;
  --card-paper:#FBFBF8; --card-ink:#1C232E; --card-line:#E1E3E0;
  --display:"Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(20,30,45,.08),0 4px 14px rgba(20,30,45,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C; --surface:#1A2029; --sunk:#151A22; --ink:#E6E9EF; --muted:#9BA4B3; --line:#2B3341;
  --accent:#3BBFC6; --accent-ink:#0B1A1C; --legend:#E2AA3C; --warn:#F07A55; --ok:#5CC48A;
  --card-paper:#1F2630; --card-ink:#E8EAEE; --card-line:#323B48;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151C; --surface:#1A2029; --sunk:#151A22; --ink:#E6E9EF; --muted:#9BA4B3; --line:#2B3341;
  --accent:#3BBFC6; --accent-ink:#0B1A1C; --legend:#E2AA3C; --warn:#F07A55; --ok:#5CC48A;
  --card-paper:#1F2630; --card-ink:#E8EAEE; --card-line:#323B48;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent)}
.field.col{flex-direction:column;align-items:stretch;gap:4px;color:var(--ink);font-weight:500}
.field.col input{width:100%}
.authf{max-width:420px}
.acct .btn{text-decoration:none;color:var(--ink)}
.acct .btn.primary{color:var(--accent-ink)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:.02em;white-space:nowrap}
.brand small{font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--sunk);box-shadow:inset 0 -2px 0 var(--accent)}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bhead h1{margin-bottom:0}
.btn.newdeck{font-weight:700}
.newdeck-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.discord-btn{flex:none;text-decoration:none;color:var(--ink)}
.acct{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.acct img{width:26px;height:26px;border-radius:50%}
.skin-btn{flex:none}
@media (max-width:720px){.top .brand{order:-2}.skin-btn{order:-1;margin-left:auto;padding:3px 8px;font-size:.75rem}}
.acct b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main .wrap{padding-block:22px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.9rem}
h2{font-size:1.35rem}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.field{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
select,input[type=search],input[type=text],input[type=email],input[type=password],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{min-width:0;width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

/* card tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.group-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.group-h:first-child{margin-top:0}
.group-h .dot{width:12px;height:12px;border-radius:3px;background:var(--cc);transform:rotate(45deg)}
.group-h span{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:400}
.card{position:relative;display:flex;flex-direction:column;background:var(--card-paper);color:var(--card-ink);border:1px solid var(--card-line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;min-width:0}
button.card{cursor:pointer}
button.card:hover{border-color:var(--cc)}
.c-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--cc);color:var(--ct);min-height:46px}
.c-name{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.15;flex:1;min-width:0}
.gem{flex:none;width:32px;height:36px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card-paper);color:var(--card-ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:1rem}
.c-type{padding:6px 12px 0;font-size:.8rem;color:var(--muted);letter-spacing:.02em;display:flex;gap:6px;justify-content:space-between}
.c-type .leg{color:var(--legend);font-weight:700}
.c-rules{padding:6px 12px 10px;font-size:.9rem;line-height:1.38;flex:1}
.c-rules p{margin:0 0 4px}
.lv{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--surface);vertical-align:1px}
.aura{display:inline-block;width:.72em;height:.9em;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);vertical-align:-1px;margin-left:1px}
.cver{font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.03em;color:var(--muted);border:1px solid var(--card-line);border-radius:4px;padding:0 4px;margin-left:4px}
.c-foot{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--card-line);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.stats{display:flex;gap:4px;width:100%}
.stat{flex:1;text-align:center;border:1px solid var(--card-line);border-radius:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:1rem;color:var(--card-ink)}
.stat i{font-style:normal;font-size:.68rem;letter-spacing:.08em}
.c-ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--card-line);background:var(--sunk)}
.c-ctrl .q{font-variant-numeric:tabular-nums;font-weight:700;min-width:3ch;text-align:center}
.c-ctrl .btn{padding:2px 10px}
.c-ctrl .sp{flex:1}
.card.picked{outline:3px solid var(--accent);outline-offset:-1px}
.card .slotbadge{position:absolute;top:52px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}

/* builder */
.steps{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:.8rem}
.step.on{color:var(--ink)} .step.on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done b{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps .sep{width:28px;height:1px;background:var(--line)}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:74px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.slot.full{border-style:solid;border-color:var(--cc)}
.slot small{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.slot .nm{font-family:var(--display);font-weight:700;font-size:1.05rem}
.slot .cl{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.slot .cl .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.slot.hero-full{padding:0;border:0;background:none;min-height:0}
.slot.hero-full .card{height:100%}
.slot.hero-full .slotbadge{top:12px;background:rgba(255,255,255,.92);color:#18202B}
.dl li .nlink{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.dl li .nlink:hover{color:var(--accent);text-decoration:underline}
.dl li .nlink.bad{color:var(--warn)}
.deck.best .best-h{display:flex;align-items:center;gap:10px}
.deck.best .best-h h3{flex:1;min-width:0}
.deck.best .rank{font-family:var(--display);font-weight:800;color:var(--muted)}
.deck.best .pct{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--ok);font-variant-numeric:tabular-nums}
.deck.best .best-rec{font-size:.9rem;font-variant-numeric:tabular-nums}
.deck.best .pill{cursor:pointer}
.bar a.btn{text-decoration:none;color:var(--ink)}
.slot .x{align-self:flex-start;border:0;background:none;color:var(--muted);padding:0;font-size:.8rem;text-decoration:underline}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start;margin-top:8px}
.deckpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 90px);overflow:auto}
.deckpanel input[type=text]{width:100%;font-family:var(--display);font-size:1.15rem;font-weight:700}
.meter{display:flex;align-items:baseline;gap:8px}
.meter .big{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.meter .of{color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.over i{background:var(--warn)}
.curve{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;height:70px}
.curve div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.curve span.b{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.curve-l{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dl h4{margin:8px 0 2px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.dl ul{list-style:none;margin:0;padding:0}
.dl li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.dl li .q{font-weight:700;width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.dl li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl li .n.bad{color:var(--warn)}
.dl li .dot{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.dl li .cst{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--line);background:none;border-radius:5px;width:22px;height:22px;padding:0;line-height:1;font-size:.95rem}
.issues{margin:0;padding:10px 12px;border-radius:10px;font-size:.88rem;list-style:none;display:flex;flex-direction:column;gap:3px}
.issues.bad{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink)}
.issues.bad li::before{content:"✕ ";color:var(--warn);font-weight:700}
.issues.good{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.issues.good li::before{content:"✓ ";color:var(--ok);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.82rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;grid-column:1/-1}

/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.deck h3{font-size:1.15rem}
.deck .pips{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--sunk);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.status{font-size:.82rem;font-weight:700}
.status.ok{color:var(--ok)} .status.no{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.panel textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .card{box-shadow:none}
.modal .c-rules{font-size:1rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-size:.92rem;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.busy{position:fixed;inset:0;z-index:55;background:rgba(10,14,20,.45);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.3rem}

/* test hand */
.modal .box.wide{max-width:980px}
.handbtn{justify-content:center}
.btn.primary.go{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn.primary.go:hover:not(:disabled){filter:brightness(1.08)}
.hstats{display:flex;gap:4px;margin:6px 0 4px}
.hstats>span{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:1px 0;background:var(--sunk);font-variant-numeric:tabular-nums;line-height:1.15}
.hstats b{display:block;font-size:.95rem}
.hstats i{display:block;font-style:normal;font-size:.62rem;letter-spacing:.08em;color:var(--muted)}
.hstats.sm{margin:0;gap:3px;flex:none}
.hstats.sm>span{flex:none;min-width:30px;padding:0 3px}
.hstats.sm b{font-size:.82rem}
.hstats.sm i{font-size:.55rem}
.btn.primary.handbtn{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.btn.primary.handbtn:hover{filter:brightness(1.08)}
.hand-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hand-t{min-width:0;flex:1 1 220px}
.hand-r{display:flex;align-items:flex-start;gap:10px;margin-left:auto}
.aura-box{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 12px;border:1.5px solid var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.aura-gem{width:30px;height:38px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none}
.aura-box b{display:block;font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.aura-box small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px}
.aura-src{display:block;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hand-stats{display:flex;flex-wrap:wrap;gap:6px}
.hand-stats b{font-variant-numeric:tabular-nums}
.hand-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.hand-grid .slotbadge{top:auto;bottom:9px;right:10px}
.note.warn{color:var(--warn)}
@media (max-width:560px){.hand-r{width:100%;margin-left:0}.hand-r .aura-box{flex:1}.grid.hand-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.hand-grid .c-rules{font-size:.82rem}.modal .box.wide{padding:14px}}

/* rules */
.rules-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
.rtoc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.rtoc-list{display:flex;flex-direction:column;gap:1px}
.rtoc-list button{text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:.9rem}
.rtoc-list button:hover{background:var(--sunk);color:var(--ink)}
.rtoc-sel{display:none;width:100%}
.rules{max-width:78ch;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 32px 32px}
.rules h2{font-size:1.45rem;margin:26px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.rules .rsec:first-child h2{border-top:0;padding-top:8px}
.rules h3{font-size:1.12rem;margin:22px 0 6px}
.rules p,.rules li{line-height:1.6}
.rules p{margin:8px 0}
.rules ul,.rules ol{padding-left:1.4em;margin:8px 0}
.rules li{margin:3px 0}
.rules em{color:var(--muted)}
.rsec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.tblwrap{overflow-x:auto;margin:12px 0}
.rules table{border-collapse:collapse;width:100%;font-size:.93rem}
.rules th,.rules td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.rules th{background:var(--sunk);font-weight:700}
@media (max-width:900px){
  .rules-wrap{grid-template-columns:minmax(0,1fr)}
  .rtoc{position:static;max-height:none}
  .rtoc-list{display:none}
  .rtoc-sel{display:block}
